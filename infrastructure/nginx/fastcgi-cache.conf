# FastCGI Cache Configuration for Nginx
# Place this in: /etc/nginx/conf.d/fastcgi-cache.conf

# Cache path and settings
fastcgi_cache_path /var/cache/nginx/fastcgi 
    levels=1:2 
    keys_zone=FASTCGI:100m 
    inactive=60m 
    max_size=1g
    use_temp_path=off;

# Cache key
fastcgi_cache_key "$scheme$request_method$host$request_uri";

# Skip cache for these conditions
fastcgi_cache_bypass $http_pragma $http_authorization $cookie_laravel_session;
fastcgi_no_cache $http_pragma $http_authorization $cookie_laravel_session;
