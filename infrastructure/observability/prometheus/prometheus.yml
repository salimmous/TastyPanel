global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: "tastypanel-platform"
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - host.docker.internal:8000
    bearer_token: "replace-with-prometheus-token"

