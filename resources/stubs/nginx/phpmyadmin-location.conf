# Include inside the panel server block (before location /).
# Serves phpMyAdmin at /phpmyadmin/ on the same host/port as the panel.
# Adjust fastcgi_pass to your PHP-FPM socket (e.g. php8.4-fpm.sock).

location /phpmyadmin/ {
    alias /usr/share/phpmyadmin/;
    index index.php;
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $request_filename;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~* \.(ht|git|ini)$ { deny all; }
}
