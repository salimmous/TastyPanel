<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Ready - TastyPanel</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f4f7f6;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        .card {
            background: white;
            padding: 3rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 400px;
            border: 1px solid #e1e8e7;
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #2ecc71;
        }

        h1 {
            margin: 0 0 1rem;
            font-size: 1.5rem;
            color: #2c3e50;
        }

        p {
            color: #7f8c8d;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .footer {
            font-size: 0.8rem;
            color: #bdc3c7;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon">✓</div>
        <h1>Site is Ready!</h1>
        <p>This domain has been successfully provisioned by <strong>TastyPanel</strong> infrastructure. You can now
            upload your files via SFTP or install an application from the platform.</p>
        <div class="footer">Powered by TastyPanel Platform</div>
    </div>
</body>

</html>
