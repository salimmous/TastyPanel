server {
    listen 80;
    listen [::]:80;
    server_name tastypanel.site www.tastypanel.site;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tastypanel.site www.tastypanel.site;

    root /home/cms/htdocs/tastypanel.site/public;
    index index.php index.html;

    charset utf-8;

    # SSL Configuration (adjust paths as needed)
    # ssl_certificate /path/to/ssl/certificate.crt;
    # ssl_certificate_key /path/to/ssl/private.key;

    # Logging
    access_log /var/log/nginx/tastypanel.site-access.log;
    error_log /var/log/nginx/tastypanel.site-error.log;

    # Maximum upload size
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Serve build assets directly (must be before main location block)
    location /build {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Serve download archives (tar.gz, zip)
    location ~* \.(tar\.gz|zip)$ {
        try_files $uri =404;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, no-cache";
    }

    # Serve static files directly (but only if they exist)
    location ~* \.(jpg|jpeg|gif|png|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API routes - must go to Laravel
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Main location block - All requests go to index.php for Laravel routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM configuration
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;  # Adjust PHP version as needed
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to storage and bootstrap cache
    location ~ ^/(storage|bootstrap/cache) {
        deny all;
        return 404;
    }
}

